[package]
name = "diplay-media"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "diplay_media"
crate-type = ["cdylib", "rlib"]

[dependencies]
jni-sys = "0.3"
libc = "0.2"
opus-pure = "=0.2.3"
ring = "0.17"
curve25519-dalek = { version = "=5.0.0", default-features = false }
num-bigint = { version = "=0.5.1", default-features = false, features = ["std"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

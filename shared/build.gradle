plugins {
    id 'com.android.library'
}

abstract class LicenseAssetsTask extends Sync {
    @OutputDirectory
    abstract DirectoryProperty getOutputDirectory()
}

def licenseAssets = tasks.register('prepareLicenseAssets', LicenseAssetsTask) {
    outputDirectory.set(layout.buildDirectory.dir('generated/licenseAssets'))
    into outputDirectory
    into('licenses') {
        from(rootProject.file('LICENSE')) { rename { 'GPL-3.0.txt' } }
        from(rootProject.file('NOTICE.md'))
        from(rootProject.file('docs/THIRD_PARTY_NOTICES.md'))
        from(rootProject.file('docs/licenses/DiAuto-AGPL-3.0.txt')) { rename { 'AGPL-3.0.txt' } }
        from(rootProject.file('docs/licenses/dependencies'))
        from(rootProject.file('docs/licenses/SOURCE.txt'))
        from('src/main/jni/speexdsp/COPYING') { rename { 'SpeexDSP-COPYING.txt' } }
        from('src/testCore/java/org/concentus/LICENSE') { rename { 'Concentus-LICENSE.txt' } }
        from('src/main/jniLibs/NOTICE.md') { rename { 'NATIVE-NOTICE.md' } }
    }
}

android {
    namespace = 'com.shihab.diplay.shared'
    compileSdk = 37

    defaultConfig {
        minSdk = 24
        consumerProguardFiles 'ambient-consumer-rules.pro'
        targetSdk = 37

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }
    // The native sources in src/main/jni (local_hotspot_radio, speex_echo, diplay_i2c) are built
    // with ndk-build. Ordinary Gradle APK builds consume the prebuilt jniLibs instead of compiling
    // them; those libraries are rebuilt from these sources with NDK 28.2.13676358 (see
    // src/main/jniLibs/NOTICE.md for provenance and rebuild steps). Keep the build path ASCII-only
    // when regenerating them, because the NDK's GNU make cannot handle non-ASCII paths.
    buildFeatures {
        // Geely/Lynk head-unit input API (com.geely.inputservice); declarations in src/main/aidl.
        aidl true
    }
    testOptions {
        unitTests.includeAndroidResources = true
        // Optional: a head-unit AdaptAPI JAR kept outside the repository, for EcarxAdaptapiAbiTest.
        unitTests.all {
            def adaptapiJar = findProperty('ecarxAdaptapiJar') ?: System.getenv('ECARX_ADAPTAPI_JAR') ?: ''
            systemProperty 'ecarx.adaptapi.jar', adaptapiJar
            // Some vendor classes lack stack map frames; the ABI test only reads their signatures.
            if (adaptapiJar) jvmArgs '-XX:+UnlockDiagnosticVMOptions', '-XX:-BytecodeVerificationRemote'
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }
}
androidComponents {
    onVariants(selector().all()) { variant ->
        variant.sources.assets.addGeneratedSourceDirectory(licenseAssets) { task -> task.outputDirectory }
    }
}
dependencies {
    implementation libs.androidx.annotation
    implementation libs.jmdns
    testImplementation libs.junit
    testImplementation 'org.robolectric:robolectric:4.17'
    androidTestImplementation libs.junit
    androidTestImplementation 'androidx.test:runner:1.7.0'
}

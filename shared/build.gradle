plugins {
    id 'com.android.library'
}
// Explicit A/B input; ordinary builds keep the existing capture path in every variant.
def siriCommunicationCapture = providers.gradleProperty('siriCommunicationCapture').getOrElse('false')
if (!(siriCommunicationCapture in ['true', 'false'])) {
    throw new GradleException('siriCommunicationCapture must be true or false')
}
android {
    namespace = 'com.shilapi.xcertplay.shared'
    compileSdk = 37

    defaultConfig {
        minSdk = 24
        consumerProguardFiles 'ambient-consumer-rules.pro'
        targetSdk = 37
        buildConfigField 'boolean', 'SIRI_COMMUNICATION_CAPTURE', siriCommunicationCapture

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'
        }

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }
    // The native sources in src/main/jni (local_hotspot_radio, speex_echo, xcertplay_i2c) are built
    // with ndk-build upstream. This checkout lives under a path containing non-ASCII characters,
    // and the NDK's GNU make cannot handle such a path - it mangles it and then fails to find
    // jni.h. The three libraries are therefore consumed as prebuilt jniLibs, taken from the
    // published DiPlay-0.2.15.apk, byte for byte. See src/main/jniLibs/NOTICE.md for provenance.
    buildFeatures {
        buildConfig true
        // Geely/Lynk head-unit input API (com.geely.inputservice); declarations in src/main/aidl.
        aidl true
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }
}
dependencies {
    implementation libs.androidx.app
    implementation libs.bouncycastle
    implementation libs.jmdns
    testImplementation libs.junit
    testImplementation 'org.robolectric:robolectric:4.17'
}

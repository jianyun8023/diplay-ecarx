name: Build DiPlay source-only debug APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Reject credential files in public source
        run: python3 scripts/check_public_tree.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;28.2.13676358
      - uses: gradle/actions/setup-gradle@v4
      - name: Test, lint and build without authentication assets
        run: ./gradlew :shared:testDebugUnitTest :common:testDebugUnitTest :mobile:lintDebug :mobile:assembleDebug --stacktrace
      - name: Prepare Debug APKs and matching source
        run: |
          mkdir -p source-apk
          # One debug APK per shipped ABI (ARM64 default, ARMv7 fallback, x86_64 test-only).
          cp mobile/build/outputs/apk/debug/DiPlay-v*-*-debug.apk source-apk/
          git archive --format=tar.gz --prefix=DiPlay-source/ --output=source-apk/DiPlay-source.tar.gz HEAD
          debug_source_revision=$(git rev-parse HEAD)
          printf 'Repository: %s\nCommit: %s\nSource archive: DiPlay-source.tar.gz\n' \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$debug_source_revision" > source-apk/SOURCE-REVISION.txt
          cd source-apk
          sha256sum DiPlay-v*-*-debug.apk DiPlay-source.tar.gz SOURCE-REVISION.txt > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: DiPlay-Android-TV-source-only
          path: source-apk/*
          if-no-files-found: error
          retention-days: 7

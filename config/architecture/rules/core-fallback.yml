id: dp-core-fallback
language: Kotlin
severity: error
files: ['**/src/{main,release,debug}/**/*.kt']
rule:
  any:
    - all:
        - any:
            - pattern: NativeMedia.available
            - pattern: com.shihab.diplay.airplay.NativeMedia.available
        # Existing mandatory guards propagate failure through their own check message.
        - not:
            inside:
              kind: value_argument
              inside:
                kind: value_arguments
                inside:
                  kind: call_suffix
                  inside:
                    kind: call_expression
                    has:
                      any:
                        - { kind: simple_identifier, regex: '^(check|require)$' }
                        - pattern: kotlin.check
                        - pattern: kotlin.require
    - all:
        - kind: identifier
        - regex: '^com\.shihab\.diplay\.airplay\.NativeMedia\.available$'
        - inside: { kind: import_header }
message: 已迁移的核心只有一个生产实现。调用 NativeMedia.requireAvailable() 并使用 Rust 接口，将独立 Kotlin 参考留在测试源集。
